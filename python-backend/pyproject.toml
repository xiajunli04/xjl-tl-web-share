[project]
name = "xjl-tl-ai"
version = "0.1.0"
description = "译桥 · LinguaBridge - AI 服务"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "cryptography>=50.0.2",
    "edge-tts>=7.2.8,<7.3",
    "fastapi>=0.142.2",
    "fastembed>=0.8.1",
    "httpx>=0.28.1",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "lingua-language-detector>=2.2.0",
    "markdown-it-py>=4.2.0",
    "openai>=3.23.0",
    "pillow>=11",
    "protobuf>=7.35.1,<8",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "sherpa-onnx>=1.13",
    "onnxruntime>=1.20",  # Smart Turn 句末判定（sherpa 自带的运行时不提供 Python 接口）
    "uvicorn[standard]>=0.54.0",
    "websockets>=15",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["app/interpret/vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
