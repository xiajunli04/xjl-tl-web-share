# 评测工程配置。账号密码等敏感信息从仓库根目录 .env 读取（ADMIN_USERNAME / ADMIN_PASSWORD / TEST_LLM_*）。

[platform]
# Spring 对外地址（本机 8080 被占用时与 .env 的 SERVER_PORT 保持一致）
base_url = "http://localhost:18080"
request_timeout_seconds = 60
poll_interval_seconds = 5
# 单个文档任务的最长等待时间
task_timeout_seconds = 1800

[translator]
# 译者模型：平台 biz.model_config 中的配置 id（为空表示使用平台默认模型）
model_config_id = 2

[judge]
# MQM 评审模型：直接以 OpenAI 兼容协议调用（base_url / api_key 取自 .env 的 TEST_LLM_BASE_URL / TEST_LLM_API_KEY）
model = "gpt-6-luna"
temperature = 0.0
timeout_seconds = 120

[ablation]
concurrency = 2
max_retries = 2

[improve]
# 改进验证实验（I 系列）与句子级重跑使用的独立评审模型：平台 biz.model_config 中的配置 id
review_model_config_id = 3
runs = 2

[context]
# 会话上下文与翻译记忆实验（E1–E3）。评测用户的密码从 .env 的 EVAL_TM_PASSWORD 读取（缺省见 eval/config.py）
username = "eval_tm"
# E2 两组共用的翻译模式（会话上下文在标准路径注入）
session_mode = "standard"

[image]
# 图片翻译实验（E5）：两步法使用的视觉模型配置 id（须在后台标记"支持图片输入"）；单次视觉基线直接调用的模型名
vision_model_config_id = 2
vision_model = "gpt-5.6-luna"
concurrency = 2

[speech]
# 同传实验（E4）：Python 内部 WS 地址（绕过 Spring，令牌取自 .env 的 INTERNAL_TOKEN）
ws_url = "ws://localhost:8000/internal/interpret/stream"
# 级联翻译所用的对话模型配置 id
mt_model_config_id = 7
# 句后补的静音秒数（让 VAD 判定句末）
tail_silence_seconds = 1.2
